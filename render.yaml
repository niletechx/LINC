# ==============================================================================
# LINC — Render Blueprint Configuration (render.yaml)
# https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. LINC Express.js Backend API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: linc-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: SKIP_ENV_VALIDATION
        value: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      # Optional: live Supabase / Chapa / Gemini credentials can be configured in Render dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 2. LINC React Vite Web Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: linc-web
    runtime: static
    plan: free
    region: oregon
    rootDir: client/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: linc-backend
          property: host
